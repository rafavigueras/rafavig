<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Irregular Verbs Challenge by R. Vigueras</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: #89f7fe;
            background: linear-gradient(135deg, #66a6ff 0%, #89f7fe 100%);
            min-height: 100vh;
        }
        
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }
        .animate-pop {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .input-field {
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        .input-field:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
        }
        .input-correct {
            background-color: #dcfce7 !important;
            border-color: #22c55e !important;
            color: #15803d !important;
        }
        .input-incorrect {
            background-color: #fee2e2 !important;
            border-color: #ef4444 !important;
            color: #b91c1c !important;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <div class="w-full max-w-2xl">
        
        <!-- HEADER -->
        <header class="text-center mb-8">
            <h1 class="text-4xl md:text-5xl font-black text-white drop-shadow-md mb-2 tracking-tight">
                IRREGULAR <span class="text-indigo-600 bg-white px-2 rounded-lg transform -skew-x-6 inline-block">VERBS</span>
            </h1>
            <p class="text-white font-bold text-lg opacity-90">Master the forms</p>
        </header>

        <!-- MAIN CARD -->
        <main id="main-container" class="glass-panel rounded-3xl shadow-2xl overflow-hidden relative min-h-[400px]">
            
            <!-- SCREEN: HOME -->
            <div id="screen-home" class="p-8 flex flex-col items-center justify-center h-full space-y-6 animate-pop">
                <div class="text-center space-y-2">
                    <h2 class="text-2xl font-bold text-gray-800">Welcome!</h2>
                    <p class="text-gray-600">Enter your name to start tracking your progress.</p>
                </div>
                
                <input type="text" id="player-name" placeholder="Your Name" 
                    class="w-full max-w-xs text-center text-xl font-bold py-3 px-4 rounded-xl border-2 border-gray-200 focus:border-indigo-500 outline-none transition-colors bg-white/50">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full pt-4">
                    <button id="btn-easy" class="group relative p-4 bg-emerald-500 hover:bg-emerald-600 rounded-2xl transition-all shadow-lg hover:shadow-xl hover:-translate-y-1">
                        <div class="text-white font-black text-xl">EASY MODE</div>
                        <div class="text-emerald-100 text-sm font-bold">Infinitive → Past Simple</div>
                    </button>
                    <button id="btn-hard" class="group relative p-4 bg-rose-500 hover:bg-rose-600 rounded-2xl transition-all shadow-lg hover:shadow-xl hover:-translate-y-1">
                        <div class="text-white font-black text-xl">HARD MODE</div>
                        <div class="text-rose-100 text-sm font-bold">Complete 2 Missing Forms</div>
                    </button>
                </div>

                <div class="flex gap-4 pt-4">
                    <button id="btn-view-results" class="text-indigo-600 font-bold hover:underline">View Scores</button>
                    <span class="text-gray-400">|</span>
                    <button id="btn-view-list" class="text-indigo-600 font-bold hover:underline">Study List</button>
                </div>
            </div>

            <!-- SCREEN: GAME -->
            <div id="screen-game" class="hidden p-6 md:p-8 h-full flex flex-col">
                <div class="flex justify-between items-center mb-6 bg-indigo-50 rounded-xl p-3">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold text-lg" id="q-number">1</div>
                        <span class="font-bold text-gray-500 text-sm uppercase tracking-wider">Question</span>
                    </div>
                    <div class="text-right">
                        <div class="font-black text-2xl text-indigo-600" id="score-display">0</div>
                        <div class="text-xs font-bold text-gray-400 uppercase">Score</div>
                    </div>
                </div>

                <form id="game-form" class="flex-1 flex flex-col justify-center gap-6">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="inputs-container">
                        
                        <!-- Infinitive -->
                        <div id="container-infinitive" class="flex flex-col gap-2">
                            <label class="text-xs font-black text-gray-400 uppercase tracking-widest text-center">Infinitive</label>
                            <input type="text" id="input-infinitive" autocomplete="off"
                                class="input-field w-full p-4 text-center font-bold text-xl rounded-xl bg-gray-50 text-gray-800 placeholder-gray-300 shadow-inner"
                                placeholder="...">
                        </div>

                        <!-- Past Simple -->
                        <div id="container-past" class="flex flex-col gap-2">
                            <label class="text-xs font-black text-gray-400 uppercase tracking-widest text-center">Past Simple</label>
                            <input type="text" id="input-past" autocomplete="off"
                                class="input-field w-full p-4 text-center font-bold text-xl rounded-xl bg-gray-50 text-gray-800 placeholder-gray-300 shadow-inner"
                                placeholder="...">
                        </div>

                        <!-- Past Participle -->
                        <div id="container-participle" class="flex flex-col gap-2">
                            <label class="text-xs font-black text-gray-400 uppercase tracking-widest text-center">Past Participle</label>
                            <input type="text" id="input-participle" autocomplete="off"
                                class="input-field w-full p-4 text-center font-bold text-xl rounded-xl bg-gray-50 text-gray-800 placeholder-gray-300 shadow-inner"
                                placeholder="...">
                        </div>
                    </div>

                    <div id="feedback-area" class="h-8 text-center font-bold text-lg opacity-0 transition-opacity"></div>

                    <button type="submit" id="btn-submit" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xl shadow-lg transition-transform active:scale-95">
                        Check Answer
                    </button>
                    <button type="button" id="btn-next" class="hidden w-full py-4 bg-gray-800 hover:bg-gray-900 text-white font-bold rounded-xl text-xl shadow-lg transition-transform active:scale-95">
                        Next Verb →
                    </button>
                </form>

                <div class="mt-6 text-center">
                    <button id="btn-quit" class="text-gray-400 hover:text-red-500 text-sm font-bold transition-colors">Exit Game</button>
                </div>
            </div>

            <!-- SCREEN: RESULTS -->
            <div id="screen-results" class="hidden p-8 flex flex-col items-center justify-center text-center h-full space-y-6 animate-pop">
                <div class="w-24 h-24 bg-yellow-400 rounded-full flex items-center justify-center text-4xl shadow-lg mb-2">🏆</div>
                <div>
                    <h2 class="text-3xl font-black text-gray-800 mb-1">Game Over!</h2>
                    <p class="text-gray-500 font-bold" id="final-player-name">Player</p>
                </div>
                
                <div class="bg-indigo-50 rounded-2xl p-6 w-full max-sm">
                    <div class="flex justify-between items-end mb-2">
                        <span class="text-gray-500 font-bold text-sm uppercase">Final Score</span>
                        <span class="text-4xl font-black text-indigo-600" id="final-score">0/10</span>
                    </div>
                    <div class="h-2 bg-gray-200 rounded-full overflow-hidden">
                        <div id="final-bar" class="h-full bg-indigo-600 w-0 transition-all duration-1000"></div>
                    </div>
                    <p class="text-right text-xs font-bold text-gray-400 mt-2" id="final-time">Time: 00:00</p>
                </div>

                <div class="flex gap-4 w-full pt-4">
                    <button id="btn-home-results" class="flex-1 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl transition-colors">Home</button>
                    <button id="btn-replay" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg transition-colors">Play Again</button>
                </div>
                
                <div class="w-full mt-4">
                    <h3 class="text-sm font-black text-gray-400 uppercase tracking-widest mb-2">Recent Scores</h3>
                    <div id="mini-scoreboard" class="bg-white rounded-xl border border-gray-100 divide-y divide-gray-100 max-h-32 overflow-y-auto text-sm"></div>
                </div>
            </div>

            <!-- SCREEN: LIST -->
            <div id="screen-list" class="hidden absolute inset-0 bg-white z-20 flex flex-col">
                <div class="p-4 bg-indigo-600 text-white flex justify-between items-center shadow-md">
                    <h2 class="font-bold text-lg">Study List</h2>
                    <button id="btn-close-list" class="bg-indigo-700 hover:bg-indigo-800 px-3 py-1 rounded text-sm font-bold">Close</button>
                </div>
                <div class="flex-1 overflow-y-auto p-4">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-gray-100 text-gray-500 text-xs uppercase sticky top-0">
                            <tr>
                                <th class="p-2">Infinitive</th>
                                <th class="p-2">Past Simple</th>
                                <th class="p-2">Participle</th>
                                <th class="p-2">Spanish</th>
                            </tr>
                        </thead>
                        <tbody id="verbs-table-body" class="text-gray-700 text-sm font-medium divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>

        </main>
        
        <footer class="text-center mt-6 text-white/60 text-sm font-bold">
            English Verbs Trainer v2.1
        </footer>
    </div>

    <script>
        // --- DATA ---
        const verbsData = [
            { i: "be", p: "was / were", pp: "been", s: "ser / estar" },
            { i: "become", p: "became", pp: "become", s: "llegar a ser" },
            { i: "begin", p: "began", pp: "begun", s: "empezar" },
            { i: "break", p: "broke", pp: "broken", s: "romper" },
            { i: "bring", p: "brought", pp: "brought", s: "traer" },
            { i: "build", p: "built", pp: "built", s: "construir" },
            { i: "buy", p: "bought", pp: "bought", s: "comprar" },
            { i: "catch", p: "caught", pp: "caught", s: "atrapar" },
            { i: "choose", p: "chose", pp: "chosen", s: "elegir" },
            { i: "cut", p: "cut", pp: "cut", s: "cortar" },
            { i: "come", p: "came", pp: "come", s: "venir" },
            { i: "do", p: "did", pp: "done", s: "hacer" },
            { i: "draw", p: "drew", pp: "drawn", s: "dibujar" },
            { i: "drink", p: "drank", pp: "drunk", s: "beber" },
            { i: "drive", p: "drove", pp: "driven", s: "conducir" },
            { i: "eat", p: "ate", pp: "eaten", s: "comer" },
            { i: "fall", p: "fell", pp: "fallen", s: "caer" },
            { i: "feel", p: "felt", pp: "felt", s: "sentir" },
            { i: "fight", p: "fought", pp: "fought", s: "pelear" },
            { i: "find", p: "found", pp: "found", s: "encontrar" },
            { i: "fly", p: "flew", pp: "flown", s: "volar" },
            { i: "forget", p: "forgot", pp: "forgotten", s: "olvidar" },
            { i: "get", p: "got", pp: "got", s: "obtener / llegar" },
            { i: "give", p: "gave", pp: "given", s: "dar" },
            { i: "go", p: "went", pp: "gone", s: "ir" },
            { i: "grow", p: "grew", pp: "grown", s: "crecer" },
            { i: "have", p: "had", pp: "had", s: "tener / haber" },
            { i: "hear", p: "heard", pp: "heard", s: "oír" },
            { i: "hide", p: "hid", pp: "hidden", s: "esconder" },
            { i: "hold", p: "held", pp: "held", s: "sujetar" },
            { i: "keep", p: "kept", pp: "kept", s: "mantener" },
            { i: "know", p: "knew", pp: "known", s: "saber / conocer" },
            { i: "learn", p: "learned", pp: "learned", s: "aprender" },
            { i: "leave", p: "left", pp: "left", s: "dejar / salir" },
            { i: "lend", p: "lent", pp: "lent", s: "prestar" },
            { i: "light", p: "lit", pp: "lit", s: "encender" },
            { i: "lose", p: "lost", pp: "lost", s: "perder" },
            { i: "make", p: "made", pp: "made", s: "hacer / fabricar" },
            { i: "meet", p: "met", pp: "met", s: "conocer / encontrarse" },
            { i: "pay", p: "paid", pp: "paid", s: "pagar" },
            { i: "put", p: "put", pp: "put", s: "poner" },
            { i: "read", p: "read", pp: "read", s: "leer" },
            { i: "ride", p: "rode", pp: "ridden", s: "montar" },
            { i: "run", p: "ran", pp: "run", s: "correr" },
            { i: "say", p: "said", pp: "said", s: "decir" },
            { i: "see", p: "saw", pp: "seen", s: "ver" },
            { i: "sell", p: "sold", pp: "sold", s: "vender" },
            { i: "send", p: "sent", pp: "sent", s: "enviar" },
            { i: "sew", p: "sewed", pp: "sewn", s: "coser" },
            { i: "sing", p: "sang", pp: "sung", s: "cantar" },
            { i: "show", p: "showed", pp: "shown", s: "mostrar" },
            { i: "sit", p: "sat", pp: "sat", s: "sentarse" },
            { i: "speak", p: "spoke", pp: "spoken", s: "hablar" },
            { i: "spend", p: "spent", pp: "spent", s: "gastar / pasar tiempo" },
            { i: "stand", p: "stood", pp: "stood", s: "estar de pie" },
            { i: "swim", p: "swam", pp: "swum", s: "nadar" },
            { i: "take", p: "took", pp: "taken", s: "tomar / llevar" },
            { i: "teach", p: "taught", pp: "taught", s: "enseñar" },
            { i: "tell", p: "told", pp: "told", s: "contar / decir" },
            { i: "think", p: "thought", pp: "thought", s: "pensar" },
            { i: "throw", p: "threw", pp: "thrown", s: "lanzar" },
            { i: "understand", p: "understood", pp: "understood", s: "entender" },
            { i: "wake", p: "woke", pp: "woken", s: "despertar" },
            { i: "wear", p: "wore", pp: "worn", s: "llevar puesto" },
            { i: "win", p: "won", pp: "won", s: "ganar" },
            { i: "write", p: "wrote", pp: "written", s: "escribir" }
        ];

        // --- STATE ---
        const state = {
            playerName: '',
            score: 0,
            questionCount: 0,
            totalQuestions: 10,
            mode: 'easy',
            currentVerb: null,
            startTime: null,
            endTime: null,
            hiddenFields: []
        };

        const scores = JSON.parse(localStorage.getItem('verbScores')) || [];

        // --- DOM ELEMENTS ---
        const screens = {
            home: document.getElementById('screen-home'),
            game: document.getElementById('screen-game'),
            results: document.getElementById('screen-results'),
            list: document.getElementById('screen-list')
        };

        const inputs = {
            name: document.getElementById('player-name'),
            i: document.getElementById('input-infinitive'),
            p: document.getElementById('input-past'),
            pp: document.getElementById('input-participle')
        };
        
        const containers = {
            i: document.getElementById('container-infinitive'),
            p: document.getElementById('container-past'),
            pp: document.getElementById('container-participle'),
            grid: document.getElementById('inputs-container')
        }

        const btns = {
            easy: document.getElementById('btn-easy'),
            hard: document.getElementById('btn-hard'),
            submit: document.getElementById('btn-submit'),
            next: document.getElementById('btn-next'),
            quit: document.getElementById('btn-quit'),
            homeResults: document.getElementById('btn-home-results'),
            replay: document.getElementById('btn-replay'),
            viewList: document.getElementById('btn-view-list'),
            closeList: document.getElementById('btn-close-list'),
            viewResults: document.getElementById('btn-view-results')
        };

        const displays = {
            qNumber: document.getElementById('q-number'),
            score: document.getElementById('score-display'),
            feedback: document.getElementById('feedback-area'),
            finalName: document.getElementById('final-player-name'),
            finalScore: document.getElementById('final-score'),
            finalBar: document.getElementById('final-bar'),
            finalTime: document.getElementById('final-time'),
            miniScoreboard: document.getElementById('mini-scoreboard'),
            tableBody: document.getElementById('verbs-table-body')
        };

        // --- NAVIGATION ---
        function showScreen(screenId) {
            Object.values(screens).forEach(el => {
                el.classList.add('hidden');
                el.classList.remove('animate-pop');
            });
            const active = screens[screenId];
            active.classList.remove('hidden');
            if(screenId !== 'game') active.classList.add('animate-pop');
        }

        // --- GAME LOGIC ---
        function startGame(mode) {
            const name = inputs.name.value.trim() || 'Guest';
            state.playerName = name;
            state.mode = mode;
            state.score = 0;
            state.questionCount = 0;
            state.startTime = new Date();
            
            showScreen('game');
            nextQuestion();
        }

        function nextQuestion() {
            if (state.questionCount >= state.totalQuestions) {
                endGame();
                return;
            }

            state.questionCount++;
            displays.qNumber.textContent = state.questionCount;
            displays.score.textContent = state.score;
            
            resetInputs();
            btns.submit.classList.remove('hidden');
            btns.next.classList.add('hidden');
            displays.feedback.style.opacity = '0';

            const randomIndex = Math.floor(Math.random() * verbsData.length);
            state.currentVerb = verbsData[randomIndex];

            if (state.mode === 'easy') {
                state.hiddenFields = ['p'];
                containers.pp.classList.add('hidden');
                containers.grid.classList.remove('md:grid-cols-3');
                containers.grid.classList.add('md:grid-cols-2');

                setupField('i', inputs.i); 
                setupField('p', inputs.p); 
                inputs.pp.value = '';
            } else {
                containers.pp.classList.remove('hidden');
                containers.grid.classList.remove('md:grid-cols-2');
                containers.grid.classList.add('md:grid-cols-3');

                const fields = ['i', 'p', 'pp'];
                const shuffled = [...fields].sort(() => 0.5 - Math.random());
                state.hiddenFields = shuffled.slice(0, 2); 

                setupField('i', inputs.i);
                setupField('p', inputs.p);
                setupField('pp', inputs.pp);
            }

            const firstEditable = [inputs.i, inputs.p, inputs.pp].find(el => !el.disabled && !el.parentElement.parentElement.classList.contains('hidden'));
            if(firstEditable) firstEditable.focus();
        }

        function setupField(key, inputEl) {
            if (state.hiddenFields.includes(key)) {
                inputEl.value = '';
                inputEl.disabled = false;
                inputEl.classList.remove('bg-gray-200', 'text-gray-500', 'bg-gray-50', 'text-gray-800');
                inputEl.classList.add('bg-white', 'text-gray-900');
                inputEl.placeholder = '?';
            } else {
                // MODIFIED: Show translation in parentheses when showing the clue
                const valueWithTranslation = `${state.currentVerb[key]} (${state.currentVerb.s})`;
                inputEl.value = valueWithTranslation;
                inputEl.disabled = true;
                inputEl.classList.remove('bg-white', 'text-gray-900');
                inputEl.classList.add('bg-indigo-100', 'text-indigo-800', 'text-base'); // Smaller text for long strings
                inputEl.placeholder = '';
            }
        }

        function resetInputs() {
            Object.values(inputs).forEach(input => {
                if (input === inputs.name) return;
                input.className = "input-field w-full p-4 text-center font-bold text-xl rounded-xl bg-gray-50 text-gray-800 placeholder-gray-300 shadow-inner";
            });
        }

        function checkAnswer(e) {
            e.preventDefault();
            
            let allCorrect = true;
            let feedbackMsg = "Correct!";
            let feedbackColor = "text-green-600";

            state.hiddenFields.forEach(key => {
                let inputEl;
                if (key === 'i') inputEl = inputs.i;
                if (key === 'p') inputEl = inputs.p;
                if (key === 'pp') inputEl = inputs.pp;

                const userVal = inputEl.value.trim().toLowerCase();
                const correctVal = state.currentVerb[key].toLowerCase();

                if (userVal === correctVal) {
                    inputEl.classList.add('input-correct');
                } else {
                    inputEl.classList.add('input-incorrect');
                    // MODIFIED: Correct answer also shows translation
                    inputEl.value = `${state.currentVerb[key]} (${state.currentVerb.s})`;
                    allCorrect = false;
                }
                inputEl.disabled = true;
            });

            if (allCorrect) {
                state.score++;
                displays.score.textContent = state.score;
                displays.score.classList.add('animate-bounce');
                setTimeout(() => displays.score.classList.remove('animate-bounce'), 1000);
            } else {
                feedbackMsg = "Keep trying!";
                feedbackColor = "text-red-500";
            }

            displays.feedback.textContent = feedbackMsg;
            displays.feedback.className = `h-8 text-center font-bold text-lg ${feedbackColor}`;
            displays.feedback.style.opacity = '1';

            btns.submit.classList.add('hidden');
            btns.next.classList.remove('hidden');
            btns.next.focus();
        }

        function endGame() {
            state.endTime = new Date();
            const timeDiff = Math.floor((state.endTime - state.startTime) / 1000);
            const minutes = Math.floor(timeDiff / 60);
            const seconds = timeDiff % 60;
            const timeStr = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;

            displays.finalName.textContent = state.playerName;
            displays.finalScore.textContent = `${state.score} / ${state.totalQuestions}`;
            displays.finalTime.textContent = `Time: ${timeStr}`;
            
            const pct = (state.score / state.totalQuestions) * 100;
            setTimeout(() => {
                displays.finalBar.style.width = `${pct}%`;
            }, 300);

            const record = {
                name: state.playerName,
                score: state.score,
                total: state.totalQuestions,
                mode: state.mode,
                date: new Date().toLocaleDateString()
            };
            scores.unshift(record);
            if (scores.length > 20) scores.pop();
            localStorage.setItem('verbScores', JSON.stringify(scores));

            renderScoreboard();
            showScreen('results');
        }

        function renderScoreboard() {
            displays.miniScoreboard.innerHTML = scores.map(s => `
                <div class="p-3 flex justify-between items-center hover:bg-gray-50">
                    <div>
                        <div class="font-bold text-gray-700">${s.name}</div>
                        <div class="text-xs text-gray-400">${s.mode.toUpperCase()} • ${s.date}</div>
                    </div>
                    <div class="font-black text-indigo-600">${s.score}/${s.total}</div>
                </div>
            `).join('');
        }

        function populateList() {
            displays.tableBody.innerHTML = verbsData.map(v => `
                <tr class="hover:bg-indigo-50 transition-colors">
                    <td class="p-2 border-b border-gray-100 font-bold">${v.i}</td>
                    <td class="p-2 border-b border-gray-100">${v.p}</td>
                    <td class="p-2 border-b border-gray-100">${v.pp}</td>
                    <td class="p-2 border-b border-gray-100 italic text-indigo-600">${v.s}</td>
                </tr>
            `).join('');
        }

        // --- EVENT LISTENERS ---
        btns.easy.addEventListener('click', () => startGame('easy'));
        btns.hard.addEventListener('click', () => startGame('hard'));
        document.getElementById('game-form').addEventListener('submit', checkAnswer);
        btns.next.addEventListener('click', nextQuestion);
        btns.quit.addEventListener('click', () => showScreen('home'));
        btns.homeResults.addEventListener('click', () => showScreen('home'));
        btns.replay.addEventListener('click', () => startGame(state.mode));
        
        btns.viewList.addEventListener('click', () => {
            populateList();
            screens.list.classList.remove('hidden');
        });
        btns.closeList.addEventListener('click', () => {
            screens.list.classList.add('hidden');
        });
        btns.viewResults.addEventListener('click', () => {
            renderScoreboard();
            showScreen('results');
        });

        showScreen('home');
    </script>
</body>
</html>
